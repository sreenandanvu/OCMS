name: Apply OCMS UI fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch admin UI
        shell: python
        run: |
          from pathlib import Path

          admin = Path('client/src/admin/AdminModule.jsx')
          text = admin.read_text(encoding='utf-8')

          if 'confirmingDelete' in text:
              print('UI patch already applied; nothing to do.')
              raise SystemExit(0)

          old = """  const [editing, setEditing] = useState(null);\n  const [loading, setLoading] = useState(true);\n  const [error, setError] = useState('');"""
          new = """  const [editing, setEditing] = useState(null);\n  const [confirmingDelete, setConfirmingDelete] = useState(null);\n  const [loading, setLoading] = useState(true);\n  const [error, setError] = useState('');"""
          if old not in text:
              raise SystemExit('Crud state pattern not found')
          text = text.replace(old, new, 1)

          old = """  const remove = async (id) => {\n    if (!id || !window.confirm('Delete this record? This action cannot be undone.')) return;\n    try {\n      await api(`${config.endpoint}/${id}`, { method: 'DELETE' });\n      await load();\n    } catch (err) {\n      setError(err.message);\n    }\n  };"""
          new = """  const remove = async (id) => {\n    if (!id) return;\n    setConfirmingDelete(id);\n  };\n\n  const confirmDelete = async () => {\n    if (!confirmingDelete) return;\n    try {\n      await api(`${config.endpoint}/${confirmingDelete}`, { method: 'DELETE' });\n      setConfirmingDelete(null);\n      await load();\n    } catch (err) {\n      setConfirmingDelete(null);\n      setError(err.message);\n    }\n  };"""
          if old not in text:
              raise SystemExit('remove pattern not found')
          text = text.replace(old, new, 1)

          old = """      {editing && (\n        <FormModal\n          title={editing[0]?._id ? `Edit ${config.title}` : `Add ${config.title}`}\n          fields={config.fields}\n          initial={editing[1]}\n          onClose={() => setEditing(null)}\n          onSave={save}\n        />\n      )}"""
          new = """      {editing && (\n        <FormModal\n          title={editing[0]?._id ? `Edit ${config.title}` : `Add ${config.title}`}\n          fields={config.fields}\n          initial={editing[1]}\n          onClose={() => setEditing(null)}\n          onSave={save}\n        />\n      )}\n\n      {confirmingDelete && (\n        <ConfirmModal\n          title=\"Delete record?\"\n          message=\"This action cannot be undone. The selected record will be permanently deleted.\"\n          onClose={() => setConfirmingDelete(null)}\n          onConfirm={confirmDelete}\n        />\n      )}"""
          if old not in text:
              raise SystemExit('editing modal pattern not found')
          text = text.replace(old, new, 1)

          marker = "function FormModal({ title, fields, initial = {}, options = {}, onClose, onSave }) {"
          component = r'''function ConfirmModal({ title, message, onClose, onConfirm }) {
  return (
    <div
      className="modal confirm-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirm-modal-title"
      onMouseDown={(event) => {
        if (event.target === event.currentTarget) onClose();
      }}
    >
      <div className="modal-card confirm-card">
        <div className="confirm-icon"><Trash2 size={20} /></div>
        <div className="modal-head">
          <div>
            <span className="pill">CONFIRM ACTION</span>
            <h3 id="confirm-modal-title">{title}</h3>
          </div>
          <button className="icon-btn" type="button" onClick={onClose} aria-label="Close">
            <X size={17} />
          </button>
        </div>
        <p className="confirm-message">{message}</p>
        <div className="actions">
          <button className="secondary" type="button" onClick={onClose}>Cancel</button>
          <button className="danger-button" type="button" onClick={onConfirm}>
            <Trash2 size={15} /> Delete
          </button>
        </div>
      </div>
    </div>
  );
}

'''
          if marker not in text:
              raise SystemExit('FormModal marker not found')
          text = text.replace(marker, component + marker, 1)
          admin.write_text(text, encoding='utf-8')

          css = Path('client/src/styles-clean.css')
          style = css.read_text(encoding='utf-8')
          if 'pointer-events: none;' not in style.split('.hero:after {', 1)[1].split('}', 1)[0]:
              style = style.replace('.hero:after {\n', '.hero:after {\n  pointer-events: none;\n', 1)
          if '.confirm-modal .confirm-card' not in style:
              style += """

.confirm-modal .confirm-card {
  width: min(460px, 100%);
  padding: 24px;
}
.confirm-icon {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  margin-bottom: 14px;
  border-radius: 12px;
  background: var(--danger-soft);
  color: var(--danger);
}
.confirm-card .modal-head {
  align-items: center;
  margin-bottom: 12px;
}
.confirm-card .modal-head h3 {
  margin-top: 7px;
}
.confirm-message {
  margin: 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.65;
}
.confirm-card .actions {
  margin-top: 18px;
}
.danger-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  height: 36px;
  padding: 0 13px;
  border: 1px solid var(--danger);
  border-radius: 9px;
  background: var(--danger);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
}
.danger-button:hover {
  filter: brightness(0.94);
}
"""
          css.write_text(style, encoding='utf-8')

      - name: Commit UI fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/admin/AdminModule.jsx client/src/styles-clean.css
          git diff --cached --quiet || git commit -m "Apply OCMS UI fixes"
          git push